# Openbot: sincroniza el árbol con el proyecto de origen y publica su propio instalador Windows.
#
# Cada lunes (o a demanda) integra el árbol con los cambios de la semana en una rama de trabajo,
# ejecuta las comprobaciones y las suites de trading sobre esa integración, compila desde ella el
# instalador Windows y lo publica como release completa en este mismo repositorio. La app
# instalada lee las releases de este repositorio para actualizarse, así que no hay promoción
# manual. La integración solo aterriza en la rama propia cuando todo lo anterior pasa.
#
# La rama mantiene SU PROPIA genealogía: los commits que la componen son únicamente de este
# proyecto. La integración semanal (hijo único) corta los ancestros del árbol de origen, por eso
# el listado de colaboradores del repositorio refleja solo a los autores de este proyecto. Para
# no perder el ancestro común en la mezcla, .github/upstream-pin guarda el commit del árbol de
# origen a partir del cual se integró por última vez y un replace ref local ("graft") presenta
# ese ancestro a git durante la mezcla, sin que esos commits lleguen a la rama.
#
# Cualquier fallo detiene la ejecución donde está: un conflicto de mezcla abre un issue con los
# ficheros, un check o test en rojo no publica nada, y la rama no se toca. La primera ejecución en
# un repositorio recién creado se lanza a mano con force=true.
name: Openbot · sincronizar y publicar

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Compilar y publicar aunque no haya árbol nuevo"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: openbot-release
  cancel-in-progress: false

# Los jobs de Linux fijan Ubuntu 24.04, como hace el CI de este árbol: Playwright no publica
# Chromium para la imagen nueva que movió a ubuntu-latest.
env:
  BRANCH: native-trading-bots
  UPSTREAM_URL: https://github.com/anomalyco/opencode
  UPSTREAM_BRANCH: dev
  RELEASES_REPO: ikermiranda98/openbot

jobs:
  sync:
    name: Traer el árbol
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
      changed: ${{ steps.merge.outputs.changed }}
      previous: ${{ steps.merge.outputs.previous }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Integrate the upstream tree, keeping only this project's commit history
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Commits land under the project's own identity: the contributors page tracks the branch's
          # lineage alone.
          git config user.name "ikermiranda98"
          git config user.email "ikermiranda98@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          git fetch origin "$BRANCH"

          base=$(git rev-parse "origin/$BRANCH")
          echo "previous=$base" >> "$GITHUB_OUTPUT"
          PIN=$(git show HEAD:.github/upstream-pin | tr -d "[:space:]")
          UPSTREAM_HEAD=$(git rev-parse "upstream/$UPSTREAM_BRANCH")

          if [ "$PIN" = "$UPSTREAM_HEAD" ]; then
            echo "El árbol no trae nada nuevo."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$base" >> "$GITHUB_OUTPUT"
            git push origin "$base:refs/heads/openbot-sync"
          else
            # The branch holds only this project's commits, so git sees no shared ancestor. The
            # pinned commit fills that hole locally: linking the branch's root to it lets a normal
            # merge compute the real three-way base without ever putting the upstream commits in
            # the branch.
            echo "openbot: mezcla del árbol de origen ($PIN → ${UPSTREAM_HEAD:0:7})"
            ROOT=$(git rev-list --max-parents=0 HEAD | head -1)
            git replace --graft "$ROOT" "$PIN"

            if ! git merge --no-edit "upstream/$UPSTREAM_BRANCH"; then
              # The dropped community docs coming back are not a conflict to report but their
              # standing answer: the deletion wins. The project's README wins, and the upstream
              # lockfile wins — the lock is rebuilt against the merged manifests below.
              # Anything else is a real conflict to resolve by hand.
              git rm -q --ignore-unmatch README.ar.md README.bn.md README.br.md README.bs.md README.da.md \
                README.de.md README.es.md README.fr.md README.gr.md README.it.md README.ja.md README.ko.md \
                README.no.md README.pl.md README.ru.md README.th.md README.tr.md README.uk.md README.vi.md \
                README.zh.md README.zht.md CONTRIBUTING.md SECURITY.md
              git rm -q -r --ignore-unmatch .github/ISSUE_TEMPLATE
              git checkout --ours -- README.md 2>/dev/null || true
              git checkout --theirs -- bun.lock 2>/dev/null || true
              git add README.md bun.lock 2>/dev/null || true
              # The fork's CHANGELOG is project content like the README: the branch's release log wins.
              # Upstream's release.yml is switched off on the fork right after the land (workflows are set
              # back to `$base` below), so resolving it to ours is only about letting the merge finish.
              git checkout --ours -- CHANGELOG.md 2>/dev/null || true
              git checkout --ours -- .github/workflows/release.yml 2>/dev/null || true
              git add CHANGELOG.md .github/workflows/release.yml 2>/dev/null || true
              # Any other workflow file's conflict is not a report either: the strip below takes
              # the whole directory back to the branch's own set right after the merge commit, so
              # what the merge decided for these paths is inert. Ours wins and the merge
              # finishes; upstream's edit never lands, the same as the files above.
              conflicto_workflows=$(git diff --name-only --diff-filter=U -- .github/workflows)
              if [ -n "$conflicto_workflows" ]; then
                git checkout --ours -- $conflicto_workflows
                git add -- $conflicto_workflows
              fi
              # package.json's conflicts dissolve by union, not by side-picking:
              # upstream's shape and versions win wherever upstream writes, and
              # the fork's entries upstream never had survive wherever it does.
              resolvables=$(git diff --name-only --diff-filter=U -- 'package.json' 'packages/*/package.json')
              if [ -n "$resolvables" ]; then
                OURS_SHA="$base" THEIRS_SHA="$UPSTREAM_HEAD" node .github/scripts/manifest-merge.mjs resolve $resolvables
              fi
              conflictos=$(git diff --name-only --diff-filter=U | sed 's/^/- `/; s/$/`/')

              if [ -n "$conflictos" ]; then
                gh label create "openbot-sync" --description "Avisos de la sincronización semanal" --color E99695 || true
                gh issue create \
                  --title "Sincronización del árbol bloqueada por conflictos ($(date -u +%F))" \
                  --label "openbot-sync" \
                  --body "$(printf 'La mezcla semanal con `%s` tiene conflictos en:\n\n%s\n\nNo se ha publicado nada y la rama `%s` no se ha tocado. Hay que resolverlos a mano.' "$UPSTREAM_BRANCH" "$conflictos" "$BRANCH")" \
                  || gh issue create \
                    --title "Sincronización del árbol bloqueada por conflictos ($(date -u +%F))" \
                    --body "$(printf 'Conflictos en:\n\n%s' "$conflictos")" \
                    || true
                echo "::error::La mezcla tiene conflictos en:$conflictos"
                exit 1
              fi

              git commit --no-edit
            fi

            # The tree's weekly integration never carries upstream's own workflow edits:
            # those are upstream CI files the land job switches off after landing anyway,
            # and the Actions token cannot push workflow-file changes (no workflows
            # permission) — a push that touches them is rejected outright by GitHub.
            # Empty the paths first so a workflow upstream added this week also leaves
            # (checkout alone only restores paths the source tree knows), taking the
            # set back to `$base`, the branch's own pre-merge tip.
            git rm -q -r --ignore-unmatch .github/workflows
            git checkout "$base" -- .github/workflows

            # No matter how the merge went, fork-owned manifest entries come back:
            # anything the branch tip declares and upstream does not know has to be
            # in the merged tree, or a fresh install boots without the fork's wires.
            manifests=$(git ls-files -- 'package.json' 'packages/*/package.json')
            THEIRS_SHA="$UPSTREAM_HEAD" BASE_SHA="$base" node .github/scripts/manifest-merge.mjs assert $manifests

            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$UPSTREAM_HEAD" > .github/upstream-pin
            git add .github/upstream-pin
          fi

      - name: Setup Bun
        if: steps.merge.outputs.changed == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # The pushed tree carries upstream's lock plus the fork's manifest entries,
      # so the lock is rebuilt here: the test job installs with --frozen-lockfile
      # and only succeeds when the lock agrees with the merged manifests.
      - name: Rebuild the lock against the merged manifests
        if: steps.merge.outputs.changed == 'true'
        run: bun install && git add bun.lock

      # A single-parent commit: the merged tree rides on the branch's own tip, so
      # neither the weekly integration nor anything before it ever carries upstream
      # commit ancestry. --no-verify: the fork's pre-push hook runs the whole
      # check, and bun install (above) installs husky; the Comprobar job owns
      # those checks anyway - the sync only prepares the tree.
      - name: Publish the integration
        id: publish
        if: steps.merge.outputs.changed == 'true'
        run: |
          base=$(git rev-parse "origin/$BRANCH")
          tree=$(git write-tree)
          sha=$(git commit-tree "$tree" -p "$base" -m "Sincronización semanal del árbol")
          git push --no-verify --force origin "$sha:refs/heads/openbot-sync"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  test:
    name: Comprobar
    needs: sync
    if: needs.sync.outputs.changed == 'true' || inputs.force
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: openbot-sync

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Lint
        run: bun run lint

      - name: Typecheck (TypeScript)
        run: bun run typecheck:tsc

      - name: Trading engine and tools
        working-directory: packages/core
        # The engine suites do real socket, boot and sweep work: the package's runner gives them
        # its 30s budget (bun's bare default is 5s) and the isolated HOME the unit job uses.
        run: bun run script/test.ts test/trading-engine.test.ts test/tool-trading.test.ts

      - name: App units (dictation, usage ring)
        working-directory: packages/app
        run: bun test src/voice src/usage

      - name: Desktop packaging and service
        working-directory: packages/desktop
        # Desktop's runner passes --timeout 30000; the service tests spawn real processes.
        run: bun run test electron-builder.config.test.ts src/main/service src/main/windows/trading-close.test.ts

      - name: CLI service boot
        working-directory: packages/cli
        # The service tests boot the real serve --service server. Their boot-graph compile died on the
        # v9.20261111.26 release (unbound @opencode/Location) and the suites that would have caught it
        # were not run here, so they stay in this job from now on.
        run: bun run test test/service.test.ts test/service-lifecycle.test.ts

      - name: Playwright browser
        working-directory: packages/app
        run: bunx playwright install --with-deps chromium

      - name: Trading and usage-ring end-to-end
        working-directory: packages/app
        run: bunx playwright test e2e/regression/trading.spec.ts e2e/regression/home.spec.ts --retries=1

  build:
    name: Compilar el instalador
    needs: [sync, test]
    if: needs.sync.outputs.changed == 'true' || inputs.force
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # The branch's own history is short; full depth keeps the release notes effortless.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: openbot-sync
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # 9.YYYYMMDD.RUN: siempre creciente, y siempre por encima de las versiones del CLI.
      - name: Version
        id: version
        shell: bash
        run: echo "version=9.$(date -u +%Y%m%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build the project's CLI (local channel, Windows x64 baseline)
        working-directory: packages/cli
        shell: bash
        env:
          OPENCODE_CHANNEL: local
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
        run: bun run build --single --baseline

      - name: Build the desktop app
        working-directory: packages/desktop
        shell: bash
        env:
          # The distribution's own identity: prod packages as Openbot (appId
          # ai.opencode.desktop), so updates land on the user's one installation.
          OPENCODE_CHANNEL: prod
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          OPENCODE_DESKTOP_SERVER_CHANNEL: local
          OPENBOT_RELEASES_REPO: ${{ env.RELEASES_REPO }}
        run: |
          bun run build
          # El servidor empaquetado debe ser la build del fork, nunca un CLI descargado.
          bundled=$(./resources/opencode-cli.exe --version)
          echo "Bundled CLI: $bundled"
          [ "$bundled" = "opencode v${OPENCODE_VERSION}" ] || { echo "::error::El CLI empaquetado no es el del fork ($bundled)"; exit 1; }

      - name: Package the installer
        working-directory: packages/desktop
        shell: bash
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          OPENCODE_DESKTOP_SERVER_CHANNEL: local
          OPENBOT_RELEASES_REPO: ${{ env.RELEASES_REPO }}
        run: |
          bun run pack
          cp -r ../../dist/desktop/app "$RUNNER_TEMP/app"
          OPENCODE_DESKTOP_APP="$(cygpath -w "$RUNNER_TEMP/app")" bun run pack
          mkdir -p "$RUNNER_TEMP/release"
          cp dist/latest.yml dist/openbot-win-x64.exe dist/openbot-win-x64.exe.blockmap "$RUNNER_TEMP/release/"
          ls -la "$RUNNER_TEMP/release"

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ needs.sync.outputs.previous }}
        run: |
          {
            echo "Openbot construida desde el commit ${{ needs.sync.outputs.sha }}."
            echo
            echo "### Cambios de Openbot desde la publicación anterior"
            git log --oneline --no-merges "$PREVIOUS..${{ needs.sync.outputs.sha }}" | head -60 | sed 's/^/- /' || true
          } > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" "$RUNNER_TEMP"/release/* \
            --repo "$RELEASES_REPO" \
            --title "Openbot $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

  land:
    name: Guardar la mezcla en la rama
    needs: [sync, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      # A fast-forward only: if the branch moved meanwhile, the push is refused and nothing is lost.
      - name: Fast-forward the project's branch
        if: needs.sync.outputs.changed == 'true'
        run: |
          git fetch origin openbot-sync
          git merge --ff-only "${{ needs.sync.outputs.sha }}"
          git push origin "HEAD:refs/heads/$BRANCH"

      # Workflows inherited from the shared tree (deploy gates, changelog bots) have no business
      # running on the fork: whatever the tree brings in is switched off again.
      - name: Disable inherited workflows on the fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow list --all --json path,state --jq '.[] | select(.state == "active" and .path != ".github/workflows/openbot-release.yml") | .path' |
            while read -r path; do gh workflow disable "$(basename "$path")" || true; done
