# Spike: compila la cáscara Rust (Tauri 2) en un runner con el toolchain de sopa
# fría y sube el .exe como artefacto, para medirla en local sin instalar Rust
# en la máquina. Solo a demanda: nunca corre de fondo ni en cada push.
name: Spike · cáscara Rust (Tauri)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Compilar:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Instalar dependencias
        run: bun install

      # El spike carga el MISMO bundle del renderer que genera el build de
      # Electron; electron-vite también compila main y preload, y no los usamos.
      - name: Build del renderer del proyecto
        working-directory: packages/desktop
        run: bun x electron-vite build

      - name: Copiar el renderer a los assets del spike
        run: bun run spikes/tauri/build-assets.ts

      # tauri-build exige icons/icon.ico para generar el resource file de
      # Windows; se reutiliza el icono de prod del escritorio.
      - name: Icono del shell
        run: |
          New-Item -ItemType Directory -Force spikes/tauri/src-tauri/icons | Out-Null
          Copy-Item packages/desktop/icons/prod/icon.ico spikes/tauri/src-tauri/icons/icon.ico

      - name: Toolchain de Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/tauri/src-tauri

      - name: Compilar el shell
        working-directory: spikes/tauri/src-tauri
        run: cargo build --release

      - name: Subir el ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: tauri-spike-win-x64
          path: |
            spikes/tauri/src-tauri/target/release/openbot-tauri-spike.exe
          if-no-files-found: error
